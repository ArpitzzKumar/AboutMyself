<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="oceanBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#162038"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c75e"/>
      <stop offset="50%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#a07828"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="64" cy="64" r="62" fill="url(#oceanBg)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Crossed Bones -->
  <g stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <!-- Bone 1 -->
    <line x1="30" y1="30" x2="98" y2="98"/>
    <!-- Bone 2 -->
    <line x1="98" y1="30" x2="30" y2="98"/>
  </g>
  <!-- Bone Knobs -->
  <g fill="url(#goldGrad)">
    <circle cx="28" cy="27" r="4"/>
    <circle cx="33" cy="24" r="4"/>
    <circle cx="100" cy="27" r="4"/>
    <circle cx="95" cy="24" r="4"/>
    <circle cx="28" cy="101" r="4"/>
    <circle cx="33" cy="104" r="4"/>
    <circle cx="100" cy="101" r="4"/>
    <circle cx="95" cy="104" r="4"/>
  </g>

  <!-- Pirate Skull -->
  <g filter="url(#glow)">
    <!-- Cranium -->
    <path d="M42 54 C42 38 52 30 64 30 C76 30 86 38 86 54 C86 64 80 70 76 72 L76 78 C76 80 74 82 72 82 L56 82 C54 82 52 80 52 78 L52 72 C48 70 42 64 42 54 Z" fill="#e8d5b0" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Pirate Bandana -->
    <path d="M40 46 C48 38 80 38 88 46 C84 40 76 34 64 34 C52 34 44 40 40 46 Z" fill="#8b1a1a"/>
    <circle cx="86" cy="48" r="3" fill="#c0392b"/>

    <!-- Eye Sockets -->
    <ellipse cx="53" cy="56" rx="6.5" ry="8" fill="#090d1a"/>
    <ellipse cx="75" cy="56" rx="6.5" ry="8" fill="#090d1a"/>

    <!-- Nose Cavity (Upside down heart) -->
    <path d="M64 63 L61 68 C61 69 62 70 64 69 C66 70 67 69 67 68 Z" fill="#090d1a"/>

    <!-- Teeth / Jaw lines -->
    <path d="M57 77 L57 82 M64 77 L64 82 M71 77 L71 82" stroke="#090d1a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
